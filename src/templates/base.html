<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>Qwen 2.5 Chat</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- CSS File Link -->
    <!-- لو شغال Flask/Jinja استخدم: href="{{ url_for('static', filename='css/style.css') }}" -->
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body data-theme="dark">

    <header class="header">
        <div class="brand">
            <div class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
                    <path d="M5 3v4M3 5h4M19 17v4M17 19h4"/>
                </svg>
            </div>
            <div class="brand-text">
                <span class="name">Qwen 2.5</span>
                <span class="sub">Advanced AI Language Model</span>
            </div>
        </div>
        <button class="theme" id="themeBtn" type="button"></button>
    </header>

    <main class="chat" id="chat">
        <div class="messages" id="messages">
            <div class="wrapper bot-wrapper">
                <div class="msg bot">Hello there! 😊 How can I assist you today?</div>
            </div>
        </div>
    </main>

    <div class="input-container">
        <form class="input-form" id="form">
            <textarea id="input" rows="1" placeholder="Message Qwen..." autocomplete="off"></textarea>
            <button class="send" id="send" type="submit" aria-label="Send">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m22 2-7 20-4-9-9-4Z"/>
                    <path d="M22 2 11 13"/>
                </svg>
            </button>
        </form>
    </div>

    <!-- JS File Link -->
    <!-- لو شغال Flask/Jinja استخدم: src="{{ url_for('static', filename='js/main.js') }}" -->
    <script src="../static/js/main.js" defer></script>
</body>

</html>

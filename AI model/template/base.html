<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qwen 2.5 Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #212121; color: #fff; height: 100vh; display: flex; flex-direction: column; align-items: center; }

        /* Header متسنتر في النص */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        .logo { width: 30px; height: 30px; background: #615fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; }

        /* منطقة المحادثة */
        .chat-box { flex: 1; width: 100%; max-width: 700px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { padding: 10px 15px; border-radius: 12px; max-width: 80%; line-height: 1.5; }
        .bot { background: #2f2f2f; align-self: flex-start; }
        .user { background: #615fff; align-self: flex-end; }

        /* مربع الكتابة */
        .input-area { width: 100%; max-width: 700px; padding: 15px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 20px; border: 1px solid #444; background: #2f2f2f; color: #fff; outline: none; }
        button { padding: 10px 20px; border-radius: 20px; border: none; background: #615fff; color: #fff; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Header في النص -->
    <div class="header">
        <div class="logo">Q</div>
        <span>Qwen 2.5</span>
    </div>

    <!-- الرسائل -->
    <div class="chat-box" id="chat">
        <div class="msg bot">أهلاً بيك! أنا Qwen 2.5، أقدر أساعدك إزاي؟</div>
    </div>

    <!-- الإدخال -->
    <div class="input-area">
        <input type="text" id="input" placeholder="Your message..." onkeydown="if(event.key==='Enter') send()">
        <button onclick="send()">send</button>
    </div>
</body>
</html>

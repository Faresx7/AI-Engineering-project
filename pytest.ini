[pytest]
# ──────────────────────────────────────────────────────────────────────────────
# pytest.ini — Antigravity project test configuration
# ──────────────────────────────────────────────────────────────────────────────

# Discover tests from the 'tests' package tree
testpaths = tests

# Enable asyncio mode for pytest-asyncio (required for async test functions)
asyncio_mode = asyncio

# Minimum pytest version required
minversion = 7.0

# Display verbose output and show local variable values on failure
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes
    -p no:warnings

# Register custom markers so --strict-markers doesn't fail
markers =
    unit: Pure unit tests with no I/O or external deps
    integration: FastAPI TestClient-based route tests
    stress: High-volume / adversarial / chaos tests
    asyncio: Marks async tests (managed by pytest-asyncio)

# Show the 5 slowest tests after each run
# (uncomment if pytest-durations is installed)
# addopts = --durations=5
